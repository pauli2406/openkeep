<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="description" content="OpenKeep is a self-hosted document archive for structured records, review, and search." />
    <meta property="og:title" content="OpenKeep" />
    <meta property="og:description" content="Self-hosted archive intelligence for documents, review workflows, and search." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/openkeep-social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenKeep" />
    <meta name="twitter:description" content="Self-hosted archive intelligence for documents, review workflows, and search." />
    <meta name="twitter:image" content="/brand/openkeep-social-card.svg" />
    <title>OpenKeep</title>
    <script>
      // Set the theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem("openkeep.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // Storage unavailable — still honour the OS preference.
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            prefersDark ? "dark" : "light",
          );
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
