name: Bless Mobile Baselines

# Re-renders the mobile visual baselines in the pinned Playwright container and
# opens a pull request with whatever changed.
#
# The baselines are only reproducible against one font stack, which is why the
# suite runs in a container — and a contributor whose container is broken (or who
# has no Docker at all) otherwise cannot bless an intended UI change. Taking the
# `-actual.png` files out of a failed run's artifact works but only when the run
# fails, and a version bump can slip under the diff budget: green suite, stale
# baseline, and the drift silently eats the budget a real regression needs.
#
# So this does it deliberately, in the only environment that counts.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Only bless screens matching this (Playwright --grep), e.g. settings"
        required: false
        type: string

jobs:
  bless:
    name: Re-render and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: bless-mobile

      # `--update-snapshots=all` rather than the default: a bump of one digit can
      # be smaller than the diff budget, and the default then reports nothing to
      # update while the baseline still shows the old value.
      - name: Re-render the baselines
        working-directory: apps/mobile
        run: |
          if [ -n "${{ inputs.grep }}" ]; then
            ./visual/run-in-container.sh --update-snapshots=all --grep "${{ inputs.grep }}"
          else
            ./visual/run-in-container.sh --update-snapshots=all
          fi

      - name: Show what changed
        id: diff
        run: |
          git add -A apps/mobile/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The baselines already match what the container renders." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Re-rendered baselines"
              echo
              git diff --cached --stat
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Pushing a branch rather than opening the pull request: repositories can
      # forbid Actions from creating pull requests, and this one does — the run
      # would otherwise re-render correctly and then fail on its last step. A
      # branch needs only `contents: write`, and the pull request is one command.
      - name: Push the re-rendered baselines
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="chore/bless-mobile-baselines"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "test(mobile): re-render the visual baselines

          Rendered by the Bless Mobile Baselines workflow in the pinned
          Playwright container, which is the only environment these are
          reproducible in."
          git push --force origin "$branch"
          {
            echo
            echo "Branch \`$branch\` pushed. Open the pull request with:"
            echo
            echo '```'
            echo "gh pr create --base main --head $branch \\"
            echo "  --title 'test(mobile): re-render the visual baselines'"
            echo '```'
            echo
            echo "Review the images as a claim about how the app should look: a"
            echo "screen that changed in a way the originating change did not"
            echo "intend is a bug the baseline would otherwise hide."
          } >> "$GITHUB_STEP_SUMMARY"

      # The images themselves, so a reviewer can look without checking the
      # branch out.
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: mobile-baselines
          path: apps/mobile/visual/__screenshots__/*.png
