name: Release Desktop

# Builds, signs (when credentials exist), smoke-tests, and publishes the desktop
# artifacts for one already-created GitHub Release, shaped like the server and
# iOS release workflows:
#   1. resolves the tag, refuses a commit whose CI did not pass — a release
#      never rebuilds an unverified commit into production artifacts
#   2. builds each platform on its native runner: macOS arm64 and x64 (ZIP for
#      the update feed + DMG), Windows x64 (WiX MSI), Linux x64 (deb + rpm)
#   3. smoke-tests the packaged application on every runner, and additionally
#      installs, launches, and uninstalls the deb on Linux
#   4. uploads everything to the existing GitHub Release only after ALL
#      platforms succeeded — a partial build cannot publish a partial release
#
# Updates: macOS reads these release assets through update.electronjs.org
# (public repository); Windows and Linux users are linked to the release page
# in-app — an MSI has no Squirrel feed, and installing it is the update.
#
# Signing secrets (all optional — without them the build is unsigned, which is
# fine for testing the pipeline but not for distribution):
#   APPLE_APP_CERT_P12        base64 Developer ID Application certificate
#   APPLE_APP_CERT_PASSWORD   password of that .p12
#   notarization, either:
#     APPLE_NOTARY_KEY_P8 / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER
#       an App Store Connect key — preferred, and what this repository holds
#     APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#   WINDOWS_SIGN_PARAMS       full signtool parameter string, including the
#                             certificate reference and a timestamp server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, e.g. v1.2.0"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

concurrency:
  group: release-desktop-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Resolve commit
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null \
            || { echo "::error::release ${{ inputs.version }} does not exist — run the Release workflow first"; exit 1; }

      - name: Wait for CI, and refuse a commit it did not pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          waited=0
          grace=180
          deadline=2700

          while :; do
            run=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "CI")] | sort_by(.started_at) | last')
            if [ -z "$run" ] || [ "$run" = "null" ]; then
              status="absent"
              conclusion=""
            else
              status=$(printf '%s' "$run" | jq -r '.status // "absent"')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            fi

            case "$status:$conclusion" in
              completed:success) echo "CI passed"; break ;;
              completed:*) echo "::error::CI concluded '$conclusion' for $SHA"; exit 1 ;;
              absent:*)
                if [ "$waited" -ge "$grace" ]; then
                  echo "::error::no CI run found for $SHA"; exit 1
                fi ;;
            esac

            if [ "$waited" -ge "$deadline" ]; then
              echo "::error::CI did not finish within $deadline seconds"; exit 1
            fi
            sleep 30; waited=$((waited + 30))
          done

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      # Every platform reports, even when one fails. `publish` needs all of them,
      # so a partial build still cannot publish a partial release — but a Windows
      # problem no longer hides whether macOS signing and notarization worked,
      # which is what happened three runs in a row.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            arch: arm64
            smoke: true
          - name: macOS x64
            # Cross-built on Apple Silicon rather than on an Intel runner:
            # GitHub retired the macos-13 image, so that label never gets picked
            # up and the job queues until the run is cancelled. Electron ships
            # per-architecture binaries and codesign signs a foreign-arch binary
            # happily, so the artifact is the same.
            os: macos-latest
            arch: x64
            # The one thing a cross build cannot do is run: an x64 binary needs
            # Rosetta, which an arm64 runner does not guarantee. arm64 covers the
            # startup check for macOS.
            smoke: false
          - name: Windows x64
            # Pinned to an image that ships WiX 3; `windows-latest` (2025) does
            # not carry the toolset the MSI maker needs.
            os: windows-2022
            arch: x64
            smoke: true
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            smoke: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: desktop-release-${{ runner.os }}-${{ matrix.arch }}

      - name: Set the release version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          node -e "
            const fs = require('fs');
            const file = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = '${version#v}';
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      # `APPLE_APP_CERT_P12` is the Developer ID Application certificate. The name
      # comes from the secrets this repository already held for Apple
      # distribution; reusing them beats asking for a second copy of the same
      # certificate under a different name.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.APPLE_APP_CERT_P12 != ''
        env:
          APPLE_APP_CERT_P12: ${{ secrets.APPLE_APP_CERT_P12 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_APP_CERT_PASSWORD }}
        run: |
          keychain=build.keychain
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_APP_CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$keychain" \
            -P "$APPLE_APP_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f /tmp/cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          echo "OPENKEEP_MAC_SIGNING=1" >> "$GITHUB_ENV"
          # Which identity landed, so a certificate that is not a Developer ID
          # one fails here with a readable message rather than deep inside
          # packaging.
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::the imported certificate is not a Developer ID Application certificate, so the app cannot be distributed outside the App Store"
            exit 1
          fi

      # notarytool takes the App Store Connect key as a file, so the secret is
      # written to one for the length of the job.
      #
      # The secret may hold the PEM itself or a base64 copy of it — the other
      # Apple secrets here are base64, so both are plausible and only one is
      # readable by notarytool. Writing the wrong one gets `invalidPEMDocument`
      # from deep inside notarization, which says nothing about the cause.
      - name: Write the notarization key
        if: runner.os == 'macOS' && env.APPLE_NOTARY_KEY_P8 != ''
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          path="$RUNNER_TEMP/notary-key.p8"
          if printf '%s' "$APPLE_NOTARY_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$path"
          else
            printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$path"
          fi
          chmod 600 "$path"

          # Fail here, where the cause is obvious, rather than inside notarytool.
          if ! grep -q "BEGIN PRIVATE KEY" "$path"; then
            echo "::error::APPLE_NOTARY_KEY_P8 is neither a PEM private key nor base64 of one"
            exit 1
          fi
          openssl pkey -in "$path" -noout || {
            echo "::error::APPLE_NOTARY_KEY_P8 decoded, but openssl cannot read it as a private key"
            exit 1
          }
          echo "APPLE_API_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Enable Windows signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_PARAMS != ''
        env:
          WINDOWS_SIGN_PARAMS: ${{ secrets.WINDOWS_SIGN_PARAMS }}
        shell: bash
        run: echo "OPENKEEP_WIN_SIGNING=1" >> "$GITHUB_ENV"

      # The Electron binary comes from GitHub releases, ~100 MB per leg, and that
      # download has no retry of its own. One dropped connection would fail a
      # leg, and `fail-fast` then abandons the whole release — so it is cached,
      # and the packaging step gets more than one chance.
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Make distributables
        shell: bash
        env:
          # An App Store Connect key if the repository has one, an Apple ID and
          # app-specific password otherwise; the packager prefers the key.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_SIGN_PARAMS: ${{ secrets.WINDOWS_SIGN_PARAMS }}
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @openkeep/desktop exec electron-forge make --arch=${{ matrix.arch }}; then exit 0; fi
            echo "::warning::make attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1

      # The setup exe is the MSI wrapped in a Burn bundle — same toolchain, for
      # the people who expect a Setup.exe rather than an MSI.
      - name: Make the Windows setup bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm --filter @openkeep/desktop make:windows-setup
          test -n "$(find apps/desktop/out/make -name 'OpenKeep-Setup.exe' | head -1)" || {
            echo "::error::no setup bundle was produced"; exit 1; }

      # Every leg used to check that *a* distributable existed, never that it was
      # the one this leg was asked to build. On Windows and Linux host and target
      # agree, so only the cross-built macOS leg could be wrong — and it was:
      # both macOS legs produced arm64, the names collided, and the release
      # simply had one of them twice. This is the check that would have said so.
      - name: Verify the build is for the requested architecture
        shell: bash
        run: |
          packaged=$(find apps/desktop/out -maxdepth 1 -type d -name 'OpenKeep-*-*')
          count=$(printf '%s\n' "$packaged" | grep -c . || true)
          echo "packaged runtimes: $packaged"
          [ "$count" = "1" ] || {
            echo "::error::expected exactly one packaged runtime, found $count — a stale build would hide the wrong architecture"
            exit 1
          }
          case "$packaged" in
            *-${{ matrix.arch }}) ;;
            *)
              echo "::error::packaged runtime is $packaged, not ${{ matrix.arch }} — the architecture flag did not reach the packager"
              exit 1
              ;;
          esac
          # The DMG is the artifact that collided, so its name has to carry the
          # architecture too.
          if [ "${{ runner.os }}" = "macOS" ]; then
            find apps/desktop/out/make -name "*-${{ matrix.arch }}.dmg" | grep -q . || {
              echo "::error::no DMG named for ${{ matrix.arch }}"
              exit 1
            }
          fi

      - name: Smoke-test the packaged application
        if: matrix.smoke && runner.os != 'Linux'
        run: pnpm --filter @openkeep/desktop test:smoke

      - name: Smoke-test the packaged application (Linux)
        if: matrix.smoke && runner.os == 'Linux'
        run: |
          sandbox="$(find apps/desktop/out -name chrome-sandbox -maxdepth 2 | head -1)"
          if [ -n "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi
          xvfb-run -a pnpm --filter @openkeep/desktop test:smoke

      # The installed package, not just the unpacked build: install the deb,
      # verify desktop integration and MIME registration, launch the installed
      # binary, and confirm removal leaves nothing behind.
      - name: Install, launch, and uninstall the deb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(find apps/desktop/out/make -name '*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no deb was produced"; exit 1; }
          # `apt-get install` rather than `dpkg -i`: the package depends on
          # libnotify4 and dpkg does not resolve dependencies, so it would leave
          # the package unconfigured and fail. This is also what a user runs.
          sudo apt-get update
          sudo apt-get install -y "$(realpath "$deb")"

          test -x /usr/lib/openkeep/openkeep || { echo "::error::installed binary missing"; exit 1; }
          desktop_file=$(ls /usr/share/applications/*openkeep*.desktop 2>/dev/null | head -1)
          [ -n "$desktop_file" ] || { echo "::error::.desktop entry missing"; exit 1; }
          grep -qi "application/pdf" "$desktop_file" \
            || { echo "::error::MIME associations missing from the desktop entry"; exit 1; }

          sudo chown root:root /usr/lib/openkeep/chrome-sandbox
          sudo chmod 4755 /usr/lib/openkeep/chrome-sandbox
          xvfb-run -a /usr/lib/openkeep/openkeep --smoke-test | tee /tmp/smoke.out
          grep -q OPENKEEP_DESKTOP_SMOKE_OK /tmp/smoke.out

          sudo apt-get remove -y openkeep
          [ ! -e /usr/lib/openkeep ] || { echo "::error::uninstall left /usr/lib/openkeep behind"; exit 1; }
          [ ! -e "$desktop_file" ] || { echo "::error::uninstall left the desktop entry behind"; exit 1; }

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/out/make -type f \
            \( -name '*.zip' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to the release
    # `needs: build` only runs when every matrix leg succeeded, which is what
    # keeps a partial platform build from publishing a partial release.
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release upload "${{ inputs.version }}" dist/* \
            --repo "${{ github.repository }}" --clobber

      - name: Summary
        run: |
          {
            echo "## Desktop release ${{ inputs.version }}"
            echo
            echo "Uploaded: $(ls dist | tr '\n' ' ')"
            echo
            echo "macOS clients update through update.electronjs.org; Windows and"
            echo "Linux clients link to this release page."
          } >> "$GITHUB_STEP_SUMMARY"
