name: Build & Push Production Images

# Baut alle openkeep-Server-Images und pusht sie nach GHCR.
# Der VPS (Dokploy) zieht nur fertige Images – dort wird nie gebaut.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute worker-base fingerprint
        id: fingerprint
        run: echo "value=$(sha256sum docker/worker-base.Dockerfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build & push worker-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker-base.Dockerfile
          push: true
          build-args: |
            WORKER_BASE_FINGERPRINT=${{ steps.fingerprint.outputs.value }}
          tags: ghcr.io/${{ github.repository_owner }}/openkeep-worker-base:latest
          cache-from: type=gha,scope=worker-base
          cache-to: type=gha,mode=max,scope=worker-base

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openkeep-api:latest
            ghcr.io/${{ github.repository_owner }}/openkeep-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openkeep-migrate:latest
            ghcr.io/${{ github.repository_owner }}/openkeep-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/openkeep-worker-base:latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/openkeep-worker:latest
            ghcr.io/${{ github.repository_owner }}/openkeep-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
